name: Build kaelljagobgt

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Repo source kernel (owner/nama)"
        required: true
        default: "Arkael-Dev/arkael-kernel-a12-5.10"
      source_ref:
        description: "Branch source kernel"
        required: true
        default: "bore-bbrv3-5.10"
      defconfig:
        description: "Defconfig (isi sesuai source, mis. gki_defconfig)"
        required: true
        default: "gki_defconfig"
      lto_mode:
        description: "LTO mode"
        type: choice
        default: "thin"
        options:
          - thin
          - keep
          - full
          - none
      ksu_enable:
        description: "Integrasi KernelSU-Next"
        type: boolean
        default: true
      kaelltzyy_default:
        description: "Jadikan governor kaelltzyy sebagai default"
        type: boolean
        default: false
      gaming_tweaks:
        description: "Tweak gaming (O3, BBR default, kurangi debug) + modul runtime KSU"
        type: boolean
        default: true
      hz_mode:
        description: "Tick rate HZ (1000 = paling responsif tapi boros baterai; keep = aman)"
        type: choice
        default: "keep"
        options:
          - keep
          - "300"
          - "1000"
      ntsync_enable:
        description: "Aktifkan NTSync (/dev/ntsync untuk Wine/Proton/Winlator)"
        type: boolean
        default: true
      ntsync_patch_url:
        description: "URL patch backport NTSync 5.10 (kosong = pakai yang sudah ada di source)"
        required: false
        default: ""

env:
  KERNEL_NAME: kaelljagobgt
  # Nama yang tampil di HP (uname -r)
  KERNEL_LOCALVERSION: KaelltzyyxPERF
  ARCH: arm64
  # KernelSU-Next: branch next = terbaru. Ganti ke tag stabil kalau next gagal build
  KSU_REPO: KernelSU-Next/KernelSU-Next
  KSU_BRANCH: next
  # Kosong = tag stabil terbaru. Isi "next" kalau mau branch dev
  KSU_REF: ""
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3
  TZ: Asia/Jakarta

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          submodules: recursive

      - name: Maksimalkan ruang disk + swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h /
          free -h

      - name: Install dependensi
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git libelf-dev libssl-dev \
            libncurses-dev lz4 python3 rsync unzip zip xz-utils zstd cpio \
            libarchive-tools device-tree-compiler

      - name: Download Neutron clang
        run: |
          mkdir -p "$HOME/neutron"
          cd "$HOME/neutron"
          bash <(curl -s https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman) -S
          echo "$HOME/neutron/bin" >> "$GITHUB_PATH"
          "$HOME/neutron/bin/clang" --version | head -n1

      - name: Integrasi KernelSU-Next
        if: ${{ inputs.ksu_enable }}
        run: |
          test -d drivers || { echo "Bukan di root source kernel: $(pwd)"; ls -la; exit 1; }
          curl -fLSs "https://raw.githubusercontent.com/${KSU_REPO}/${KSU_BRANCH}/kernel/setup.sh" | bash -s ${KSU_REF}
          ls -la

      - name: Integrasi NTSync
        if: ${{ inputs.ntsync_enable }}
        env:
          NTSYNC_PATCH_URL: ${{ inputs.ntsync_patch_url }}
        run: |
          if [ -f drivers/misc/ntsync.c ]; then
            echo "NTSync sudah ada di source, tidak perlu patch."
          elif [ -n "$NTSYNC_PATCH_URL" ]; then
            curl -fLSs "$NTSYNC_PATCH_URL" -o ntsync.patch
            git apply --check -p1 ntsync.patch || { echo "Patch NTSync tidak cocok dengan source ini"; exit 1; }
            git apply -p1 ntsync.patch
            echo "Patch NTSync diterapkan."
          else
            echo "::warning::Source tidak punya NTSync dan ntsync_patch_url kosong. NTSync dilewati."
          fi
          # Beberapa versi Kconfig menandai NTSync BROKEN; lepaskan supaya bisa dipilih
          if [ -f drivers/misc/Kconfig ] && grep -q "config NTSYNC" drivers/misc/Kconfig; then
            sed -i '/config NTSYNC/,/^config /{/depends on BROKEN/d}' drivers/misc/Kconfig
            grep -n -A6 "config NTSYNC" drivers/misc/Kconfig
          fi

      - name: Tambah governor Kaelltzyy
        run: |
          cat > drivers/cpufreq/cpufreq_kaelltzyy.c <<'EOF'
          // SPDX-License-Identifier: GPL-2.0-only
          /*
           * Governor Kaelltzyy (fork dari governor performance)
           */
          #include <linux/cpufreq.h>
          #include <linux/init.h>
          #include <linux/module.h>

          static void cpufreq_gov_kaelltzyy_limits(struct cpufreq_policy *policy)
          {
              pr_debug("kaelltzyy: setting to %u kHz\n", policy->max);
              __cpufreq_driver_target(policy, policy->max, CPUFREQ_RELATION_H);
          }

          static struct cpufreq_governor cpufreq_gov_kaelltzyy = {
              .name   = "kaelltzyy",
              .owner  = THIS_MODULE,
              .flags  = CPUFREQ_GOV_STRICT_TARGET,
              .limits = cpufreq_gov_kaelltzyy_limits,
          };

          #ifdef CONFIG_CPU_FREQ_DEFAULT_GOV_KAELLTZYY
          struct cpufreq_governor *cpufreq_default_governor(void)
          {
              return &cpufreq_gov_kaelltzyy;
          }
          #endif

          MODULE_AUTHOR("Kaell");
          MODULE_DESCRIPTION("CPUfreq policy governor 'kaelltzyy'");
          MODULE_LICENSE("GPL");

          cpufreq_governor_init(cpufreq_gov_kaelltzyy);
          cpufreq_governor_exit(cpufreq_gov_kaelltzyy);
          EOF

          # Makefile
          sed -i '/cpufreq_performance.o/a obj-$(CONFIG_CPU_FREQ_GOV_KAELLTZYY)\t+= cpufreq_kaelltzyy.o' drivers/cpufreq/Makefile
          grep -n kaelltzyy drivers/cpufreq/Makefile

          # Kconfig
          python3 - <<'PY'
          p = "drivers/cpufreq/Kconfig"
          s = open(p).read()
          gov = ("config CPU_FREQ_GOV_KAELLTZYY\n"
                 "\ttristate \"'kaelltzyy' governor\"\n"
                 "\thelp\n"
                 "\t  Governor Kaelltzyy, fork dari governor performance.\n\n")
          dflt = ("config CPU_FREQ_DEFAULT_GOV_KAELLTZYY\n"
                  "\tbool \"kaelltzyy\"\n"
                  "\tselect CPU_FREQ_GOV_KAELLTZYY\n"
                  "\thelp\n"
                  "\t  Pakai governor 'kaelltzyy' sebagai default.\n\n")
          a = "config CPU_FREQ_GOV_PERFORMANCE\n"
          b = "config CPU_FREQ_DEFAULT_GOV_PERFORMANCE\n"
          assert a in s and b in s, "marker Kconfig tidak ketemu"
          s = s.replace(a, gov + a, 1).replace(b, dflt + b, 1)
          open(p, "w").write(s)
          PY
          grep -n -i kaelltzyy drivers/cpufreq/Kconfig

      - name: Default VM + zram (patch source)
        if: ${{ inputs.gaming_tweaks }}
        run: |
          patch_val() { # file, regex-lama, pengganti
            if grep -qE "$2" "$1"; then
              sed -i -E "s|$2|$3|" "$1"
              echo "OK   $1: $3"
            else
              echo "::warning::Pola tidak ketemu di $1: $2 (dilewati)"
            fi
          }
          # Dirty ratio 10%, background 5%, writeback 3s, expire 5s
          patch_val mm/page-writeback.c '^int vm_dirty_ratio = [0-9]+;'                'int vm_dirty_ratio = 10;'
          patch_val mm/page-writeback.c '^int dirty_background_ratio = [0-9]+;'        'int dirty_background_ratio = 5;'
          patch_val mm/page-writeback.c '^unsigned int dirty_writeback_interval = .*;'  'unsigned int dirty_writeback_interval = 3 * 100;'
          patch_val mm/page-writeback.c '^unsigned int dirty_expire_interval = .*;'     'unsigned int dirty_expire_interval = 5 * 100;'
          # VFS cache pressure 50
          patch_val fs/dcache.c '^int sysctl_vfs_cache_pressure __read_mostly = [0-9]+;' 'int sysctl_vfs_cache_pressure __read_mostly = 50;'
          # Swappiness max 20
          patch_val mm/vmscan.c '^int vm_swappiness = [0-9]+;' 'int vm_swappiness = 20;'
          # zram: kompresi default lz4 (fallback kalau tidak ada opsi Kconfig-nya)
          if ! grep -q "ZRAM_DEF_COMP_LZ4" drivers/block/zram/Kconfig 2>/dev/null; then
            patch_val drivers/block/zram/zram_drv.c 'default_compressor = "[a-z0-9-]+"' 'default_compressor = "lz4"'
          fi

      - name: Info versi kernel
        run: |
          make kernelversion
          git log -3 --oneline || true
          echo "--- BORE ---"
          grep -rn "SCHED_BORE" init/Kconfig kernel/sched/Kconfig 2>/dev/null | head -3 || true
          echo "--- BBR ---"
          grep -n -i "bbrv3\|BBR v3" net/ipv4/tcp_bbr.c | head -3 || true

      - name: Build kernel
        run: |
          export PATH="$HOME/neutron/bin:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          export KBUILD_BUILD_USER="kaell"
          export KBUILD_BUILD_HOST="github-actions"

          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CC=clang"

          make $MAKE_ARGS ${{ inputs.defconfig }}

          # LTO
          case "${{ inputs.lto_mode }}" in
            keep)
              echo "LTO: ikut defconfig"
              ;;
            thin)
              scripts/config --file out/.config -d LTO_NONE -d LTO_CLANG_FULL -e LTO_CLANG_THIN
              ;;
            full)
              scripts/config --file out/.config -d LTO_NONE -d LTO_CLANG_THIN -e LTO_CLANG_FULL
              ;;
            none)
              scripts/config --file out/.config -e LTO_NONE -d LTO_CLANG_THIN -d LTO_CLANG_FULL
              ;;
          esac

          # Governor Kaelltzyy
          scripts/config --file out/.config -e CPU_FREQ_GOV_KAELLTZYY
          if [ "${{ inputs.kaelltzyy_default }}" = "true" ]; then
            scripts/config --file out/.config -d CPU_FREQ_DEFAULT_GOV_SCHEDUTIL -e CPU_FREQ_DEFAULT_GOV_KAELLTZYY
          fi

          # KernelSU-Next (hook pakai kprobe)
          if [ "${{ inputs.ksu_enable }}" = "true" ]; then
            scripts/config --file out/.config -e KSU -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS
          fi

          # Tweak gaming (level config, aman untuk kompatibilitas modul vendor)
          if [ "${{ inputs.gaming_tweaks }}" = "true" ]; then
            # Optimasi compiler -O3 (hanya kalau source mendukung)
            if grep -q "CC_OPTIMIZE_FOR_PERFORMANCE_O3" init/Kconfig; then
              scripts/config --file out/.config -d CC_OPTIMIZE_FOR_PERFORMANCE -e CC_OPTIMIZE_FOR_PERFORMANCE_O3
            fi
            # TCP BBR sebagai default (ping online game lebih stabil)
            scripts/config --file out/.config -e TCP_CONG_BBR -e DEFAULT_BBR \
              -d DEFAULT_CUBIC -d DEFAULT_RENO --set-str DEFAULT_TCP_CONG bbr
            # Matikan debug yang tidak mengubah layout struct (aman untuk modul vendor)
            scripts/config --file out/.config -d DEBUG_PREEMPT -d PM_DEBUG -d PM_ADVANCED_DEBUG
            # zram default lz4
            if grep -q "ZRAM_DEF_COMP_LZ4" drivers/block/zram/Kconfig 2>/dev/null; then
              scripts/config --file out/.config -d ZRAM_DEF_COMP_LZORLE -d ZRAM_DEF_COMP_ZSTD \
                -e ZRAM_DEF_COMP_LZ4 --set-str ZRAM_DEF_COMP lz4
            fi
            scripts/config --file out/.config -e CRYPTO_LZ4 -e LZ4_COMPRESS -e LZ4_DECOMPRESS
            # Low-latency TCP & input
            scripts/config --file out/.config -e TCP_CONG_ADVANCED -e NET_SCH_FQ -e NET_SCH_FQ_CODEL
          fi

          # Tick rate (opsional, default keep)
          case "${{ inputs.hz_mode }}" in
            300|1000)
              H="${{ inputs.hz_mode }}"
              scripts/config --file out/.config -d HZ_100 -d HZ_250 -d HZ_300 -d HZ_1000 \
                -e HZ_$H --set-val HZ $H
              ;;
          esac

          # Touch/input boost (hanya kalau source punya driver-nya)
          if [ "${{ inputs.gaming_tweaks }}" = "true" ]; then
            for sym in CPU_INPUT_BOOST DEVFREQ_BOOST; do
              if grep -rqs "config $sym\b" drivers/ kernel/ init/ 2>/dev/null; then
                scripts/config --file out/.config -e $sym
                echo "Aktif: CONFIG_$sym"
              fi
            done
          fi

          # NTSync (built-in, supaya /dev/ntsync langsung ada tanpa load modul)
          if [ "${{ inputs.ntsync_enable }}" = "true" ]; then
            if grep -q "config NTSYNC" drivers/misc/Kconfig 2>/dev/null; then
              scripts/config --file out/.config -e NTSYNC
            else
              echo "::warning::CONFIG_NTSYNC tidak ada di Kconfig, dilewati"
            fi
          fi

          # Nama kernel
          scripts/config --file out/.config --set-str LOCALVERSION "-${KERNEL_LOCALVERSION}"
          scripts/config --file out/.config -d LOCALVERSION_AUTO

          make $MAKE_ARGS olddefconfig
          make $MAKE_ARGS -j"$(nproc --all)" Image 2>&1 | tee build.log

          test -f out/arch/arm64/boot/Image || { echo "Build gagal: Image tidak ada"; exit 1; }

      - name: Cek hasil build
        run: |
          ls -lh out/arch/arm64/boot/Image
          strings out/arch/arm64/boot/Image | grep -m1 "Linux version" || true
          grep -E '^CONFIG_(LOCALVERSION|LTO_CLANG|CFI_CLANG|MODVERSIONS|KSU|KPROBES|CPU_FREQ_DEFAULT_GOV|HZ|DEFAULT_TCP_CONG|CC_OPTIMIZE|NTSYNC)' out/.config || true
          cp out/.config kaelltzyy.config

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 "$ANYKERNEL_REPO" ak3
          rm -rf ak3/.git ak3/README.md
          cp out/arch/arm64/boot/Image ak3/Image
          DATE=$(date +%Y%m%d-%H%M)
          echo "ZIP_NAME=${KERNEL_NAME}-${DATE}" >> "$GITHUB_ENV"
          # anykernel.sh sama seperti workflow lama yang berhasil boot:
          # tanpa cek device, hanya ganti kernel (split_boot + flash_boot, ramdisk tidak dibongkar)
          cat > ak3/anykernel.sh <<'AKEOF'
          ### AnyKernel3 - KaelltzyyxPERF GKI 5.10 (tanpa cek device, kernel saja)
          properties() { '
          kernel.string=KaelltzyyxPERF
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          AKEOF
          cd ak3
          zip -r9 "../${KERNEL_NAME}-${DATE}.zip" . -x "*.git*"

      - name: Buat modul KernelSU gaming (runtime tweak)
        if: ${{ inputs.gaming_tweaks }}
        run: |
          mkdir -p gmod
          cat > gmod/module.prop <<'EOF'
          id=kaell_gaming_tweaks
          name=Kaelltzyy Gaming Tweaks
          version=1.0
          versionCode=1
          author=Kaell
          description=Tweak runtime gaming: I/O, TCP, VM, scheduler (aman, semua dicek dulu)
          EOF
          cat > gmod/service.sh <<'EOF'
          #!/system/bin/sh
          # Tunggu boot selesai
          while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 5; done
          sleep 20

          w() { [ -w "$2" ] && echo "$1" > "$2"; }

          # --- CPU governor schedutil: respon naik cepat, turun agak lambat ---
          for p in /sys/devices/system/cpu/cpufreq/policy*; do
            w 0    "$p/schedutil/up_rate_limit_us"
            w 3000 "$p/schedutil/down_rate_limit_us"
          done

          # --- I/O: kurangi overhead ---
          for q in /sys/block/sd*/queue /sys/block/mmcblk*/queue /sys/block/dm-*/queue; do
            w 0   "$q/iostats"
            w 0   "$q/add_random"
            w 2   "$q/rq_affinity"
            w 128 "$q/read_ahead_kb"
          done

          # --- VM (diulang di userspace karena init vendor sering menimpa default kernel) ---
          w 20  /proc/sys/vm/swappiness
          w 50  /proc/sys/vm/vfs_cache_pressure
          w 0   /proc/sys/vm/page-cluster
          w 10  /proc/sys/vm/dirty_ratio
          w 5   /proc/sys/vm/dirty_background_ratio
          w 300 /proc/sys/vm/dirty_writeback_centisecs
          w 500 /proc/sys/vm/dirty_expire_centisecs
          # min_free_kbytes: tambah 5 MB dari nilai bawaan boot
          MF=/proc/sys/vm/min_free_kbytes
          [ -r "$MF" ] && w $(( $(cat "$MF") + 5120 )) "$MF"

          # --- Network: latensi rendah ---
          w bbr /proc/sys/net/ipv4/tcp_congestion_control
          w 3   /proc/sys/net/ipv4/tcp_fastopen
          w 1   /proc/sys/net/ipv4/tcp_low_latency
          w 1   /proc/sys/net/ipv4/tcp_tw_reuse
          w 1   /proc/sys/net/ipv4/tcp_mtu_probing

          # --- NTSync: izinkan akses dari app (Wine/Winlator) ---
          [ -e /dev/ntsync ] && chmod 666 /dev/ntsync

          # --- Kurangi log kernel ---
          w "0 0 0 0" /proc/sys/kernel/printk

          # --- BORE (kalau ada): sedikit lebih agresif ke task interaktif ---
          w 1 /proc/sys/kernel/sched_bore

          # --- Touch boost: naikkan frekuensi CPU sebentar saat layar disentuh ---
          # Hanya node yang ada di kernel ini yang ditulis (w() melewati yang tidak ada)
          BF=""
          for p in /sys/devices/system/cpu/cpufreq/policy*; do
            [ -r "$p/cpuinfo_max_freq" ] || continue
            mf=$(cat "$p/cpuinfo_max_freq")
            # pakai ~80% frekuensi maks agar tidak terlalu panas
            bf=$(( mf * 8 / 10 ))
            for c in $(cat "$p/affected_cpus" 2>/dev/null); do BF="$BF $c:$bf"; done
          done
          BF="${BF# }"
          for d in /sys/module/cpu_boost/parameters /sys/module/cpu_input_boost/parameters /sys/kernel/cpu_input_boost; do
            [ -d "$d" ] || continue
            w "$BF" "$d/input_boost_freq"
            w 100   "$d/input_boost_ms"
            w 100   "$d/input_boost_duration"
          done

          # --- Deteksi game start (daftar paket di games.txt, satu per baris) ---
          GAMES="${0%/*}/games.txt"
          on_game_start() {
            pkg="$1"
            # Proactive compaction saat game dibuka
            w 1 /proc/sys/vm/compact_memory
            # Swappiness tidak boleh lebih dari 20
            [ "$(cat /proc/sys/vm/swappiness)" -gt 20 ] && w 20 /proc/sys/vm/swappiness
            # OOM badness game dikurangi 50% (pendekatan: oom_score_adj dibagi dua bila positif)
            for pid in $(pidof "$pkg"); do
              adj=$(cat /proc/$pid/oom_score_adj 2>/dev/null)
              [ -n "$adj" ] && [ "$adj" -gt 0 ] && w $((adj / 2)) /proc/$pid/oom_score_adj
            done
          }
          if [ -f "$GAMES" ]; then
            (
              last=""
              while true; do
                sleep 5
                fg=$(dumpsys activity activities 2>/dev/null | grep -m1 -E 'ResumedActivity' | sed -E 's/.* ([A-Za-z0-9_.]+)\/.*/\1/')
                if [ -n "$fg" ] && [ "$fg" != "$last" ]; then
                  last="$fg"
                  grep -qx "$fg" "$GAMES" && on_game_start "$fg"
                fi
              done
            ) &
          fi
          EOF
          cat > gmod/games.txt <<'EOF'
          com.tencent.ig
          com.mobile.legends
          com.dts.freefireth
          com.miHoYo.GenshinImpact
          com.activision.callofduty.shooter
          com.garena.game.codm
          EOF
          chmod 755 gmod/service.sh
          cd gmod
          zip -r9 "../kaell-gaming-module-${ZIP_NAME#*-}.zip" . -x "*.git*"

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip

      - name: Upload modul gaming
        if: ${{ inputs.gaming_tweaks }}
        uses: actions/upload-artifact@v4
        with:
          name: kaell-gaming-module
          path: kaell-gaming-module-*.zip

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            kaelltzyy.config
