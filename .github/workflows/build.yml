name: Build kaelljagobgt

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Repo source kernel (owner/nama)"
        required: true
        default: "Arkael-Dev/arkael-kernel-a12-5.10"
      source_ref:
        description: "Branch source kernel"
        required: true
        default: "bore-bbrv3-5.10"
      defconfig:
        description: "Defconfig (isi sesuai source, mis. gki_defconfig)"
        required: true
        default: "gki_defconfig"
      lto_mode:
        description: "LTO mode"
        type: choice
        default: "thin"
        options:
          - thin
          - keep
          - full
          - none
      ksu_enable:
        description: "Integrasi KernelSU-Next"
        type: boolean
        default: true
      kaelltzyy_default:
        description: "Jadikan governor kaelltzyy sebagai default"
        type: boolean
        default: false
      ntsync_enable:
        description: "Aktifkan NTSYNC (/dev/ntsync untuk Wine/Proton)"
        type: boolean
        default: true
      ntsync_patch_url:
        description: "URL patch backport ntsync 5.10 (.patch/.diff, opsional; kosongkan kalau source sudah punya ntsync)"
        required: false
        default: ""

env:
  KERNEL_NAME: kaelljagobgt
  # Nama yang tampil di HP (uname -r)
  KERNEL_LOCALVERSION: KaelltzyyxPERF
  ARCH: arm64
  # KernelSU-Next: branch next = terbaru. Ganti ke tag stabil kalau next gagal build
  KSU_REPO: KernelSU-Next/KernelSU-Next
  KSU_BRANCH: next
  # Kosong = tag stabil terbaru. Isi "next" kalau mau branch dev
  KSU_REF: ""
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3
  TZ: Asia/Jakarta

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          submodules: recursive

      - name: Maksimalkan ruang disk + swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h /
          free -h

      - name: Install dependensi
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git libelf-dev libssl-dev \
            libncurses-dev lz4 python3 rsync unzip zip xz-utils zstd cpio \
            libarchive-tools device-tree-compiler

      - name: Download Neutron clang
        run: |
          mkdir -p "$HOME/neutron"
          cd "$HOME/neutron"
          bash <(curl -s https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman) -S
          echo "$HOME/neutron/bin" >> "$GITHUB_PATH"
          "$HOME/neutron/bin/clang" --version | head -n1

      - name: Integrasi KernelSU-Next
        if: ${{ inputs.ksu_enable }}
        run: |
          test -d drivers || { echo "Bukan di root source kernel: $(pwd)"; ls -la; exit 1; }
          curl -fLSs "https://raw.githubusercontent.com/${KSU_REPO}/${KSU_BRANCH}/kernel/setup.sh" | bash -s ${KSU_REF}
          ls -la

      - name: Tambah governor Kaelltzyy
        run: |
          cat > drivers/cpufreq/cpufreq_kaelltzyy.c <<'EOF'
          // SPDX-License-Identifier: GPL-2.0-only
          /*
           * Governor Kaelltzyy (fork dari governor performance)
           */
          #include <linux/cpufreq.h>
          #include <linux/init.h>
          #include <linux/module.h>

          static void cpufreq_gov_kaelltzyy_limits(struct cpufreq_policy *policy)
          {
              pr_debug("kaelltzyy: setting to %u kHz\n", policy->max);
              __cpufreq_driver_target(policy, policy->max, CPUFREQ_RELATION_H);
          }

          #ifdef CONFIG_COMPACTION
          extern void kaelltzyy_compact_memory(void);
          static void kaelltzyy_compact_fn(struct work_struct *w)
          {
              kaelltzyy_compact_memory();
          }
          static DECLARE_WORK(kaelltzyy_compact_work, kaelltzyy_compact_fn);
          #endif

          /* Governor dipilih = mode game mulai -> proactive compaction */
          static int cpufreq_gov_kaelltzyy_start(struct cpufreq_policy *policy)
          {
          #ifdef CONFIG_COMPACTION
              schedule_work(&kaelltzyy_compact_work);
          #endif
              return 0;
          }

          static struct cpufreq_governor cpufreq_gov_kaelltzyy = {
              .name   = "kaelltzyy",
              .owner  = THIS_MODULE,
              .flags  = CPUFREQ_GOV_STRICT_TARGET,
              .start  = cpufreq_gov_kaelltzyy_start,
              .limits = cpufreq_gov_kaelltzyy_limits,
          };

          #ifdef CONFIG_CPU_FREQ_DEFAULT_GOV_KAELLTZYY
          struct cpufreq_governor *cpufreq_default_governor(void)
          {
              return &cpufreq_gov_kaelltzyy;
          }
          #endif

          MODULE_AUTHOR("Kaell");
          MODULE_DESCRIPTION("CPUfreq policy governor 'kaelltzyy'");
          MODULE_LICENSE("GPL");

          cpufreq_governor_init(cpufreq_gov_kaelltzyy);
          cpufreq_governor_exit(cpufreq_gov_kaelltzyy);
          EOF

          # Makefile
          sed -i '/cpufreq_performance.o/a obj-$(CONFIG_CPU_FREQ_GOV_KAELLTZYY)\t+= cpufreq_kaelltzyy.o' drivers/cpufreq/Makefile
          grep -n kaelltzyy drivers/cpufreq/Makefile

          # Kconfig
          python3 - <<'PY'
          p = "drivers/cpufreq/Kconfig"
          s = open(p).read()
          gov = ("config CPU_FREQ_GOV_KAELLTZYY\n"
                 "\ttristate \"'kaelltzyy' governor\"\n"
                 "\thelp\n"
                 "\t  Governor Kaelltzyy, fork dari governor performance.\n\n")
          dflt = ("config CPU_FREQ_DEFAULT_GOV_KAELLTZYY\n"
                  "\tbool \"kaelltzyy\"\n"
                  "\tselect CPU_FREQ_GOV_KAELLTZYY\n"
                  "\thelp\n"
                  "\t  Pakai governor 'kaelltzyy' sebagai default.\n\n")
          a = "config CPU_FREQ_GOV_PERFORMANCE\n"
          b = "config CPU_FREQ_DEFAULT_GOV_PERFORMANCE\n"
          assert a in s and b in s, "marker Kconfig tidak ketemu"
          s = s.replace(a, gov + a, 1).replace(b, dflt + b, 1)
          open(p, "w").write(s)
          PY
          grep -n -i kaelltzyy drivers/cpufreq/Kconfig

      - name: Default VM + OOM + ZRAM lz4
        run: |
          python3 - <<'PY'
          import re
          def patch(path, pattern, repl, label, count=1):
              try:
                  s = open(path).read()
              except FileNotFoundError:
                  print(f"::warning::{label}: {path} tidak ada"); return
              n, k = re.subn(pattern, repl, s, count=count, flags=re.S)
              if k == 0:
                  print(f"::warning::{label}: pola tidak ketemu di {path}"); return
              open(path, "w").write(n); print(f"OK {label}")

          # Dirty ratio 10%, background 5%
          patch("mm/page-writeback.c", r"int vm_dirty_ratio = \d+;", "int vm_dirty_ratio = 10;", "dirty_ratio")
          patch("mm/page-writeback.c", r"int dirty_background_ratio = \d+;", "int dirty_background_ratio = 5;", "dirty_background_ratio")
          # Writeback interval 3s, expire 5s (centisecs)
          patch("mm/page-writeback.c", r"(dirty_writeback_interval\s*=\s*)[^;]+;", r"\g<1>3 * 100;", "writeback_interval")
          patch("mm/page-writeback.c", r"(dirty_expire_interval\s*=\s*)[^;]+;", r"\g<1>5 * 100;", "dirty_expire")
          # VFS cache pressure 50
          patch("fs/dcache.c", r"(sysctl_vfs_cache_pressure\s+__read_mostly\s*=\s*)\d+;", r"\g<1>50;", "vfs_cache_pressure")
          # Swappiness default 20
          patch("mm/vmscan.c", r"int vm_swappiness = \d+;", "int vm_swappiness = 20;", "swappiness_default")
          # Swappiness cap max 20 (batas sysctl)
          patch("kernel/sysctl.c",
                r'(\.procname\s*=\s*"swappiness".*?\.extra2\s*=\s*)[^,}]+',
                r"\g<1>&kaell_swappiness_max", "swappiness_cap")
          patch("kernel/sysctl.c", r"(#include <linux/sysctl\.h>\n)",
                r"\g<1>\nstatic int kaell_swappiness_max = 20;", "swappiness_cap_var")
          # Min free kbytes +5 MB
          patch("mm/page_alloc.c",
                r"(new_min_free_kbytes\s*=\s*int_sqrt\(lowmem_kbytes\s*\*\s*16\);)",
                r"\g<1>\n\tnew_min_free_kbytes += 5120;", "min_free_kbytes")
          # OOM badness halving 50% (proses oom_score_adj <= 0 dibadness-kan setengah)
          patch("mm/oom_kill.c",
                r"(\tadj \*= totalpages / 1000;\n\tpoints \+= adj;\n)",
                r"\g<1>\tif (oom_score_adj <= 0)\n\t\tpoints /= 2;\n", "oom_halving")

          # Proactive compaction: helper dipanggil governor kaelltzyy saat start
          try:
              c = open("mm/compaction.c").read()
              if "kaelltzyy_compact_memory" not in c:
                  c += """
          #ifdef CONFIG_COMPACTION
          void kaelltzyy_compact_memory(void)
          {
          	compact_nodes();
          }
          EXPORT_SYMBOL_GPL(kaelltzyy_compact_memory);
          #endif
          """.replace("\n          ", "\n")
                  open("mm/compaction.c", "w").write(c); print("OK compact helper")
          except Exception as e:
              print("::warning::compact helper gagal:", e)
          PY
          grep -n "kaell_swappiness_max" kernel/sysctl.c || true
          grep -n "oom_score_adj <= 0" mm/oom_kill.c || true

      - name: Tambah NTSYNC
        if: ${{ inputs.ntsync_enable }}
        env:
          NTSYNC_PATCH_URL: ${{ inputs.ntsync_patch_url }}
        run: |
          # NTSYNC resmi masuk upstream di Linux 6.14, jadi 5.10 butuh backport.
          if [ -n "$NTSYNC_PATCH_URL" ]; then
            echo "Apply patch ntsync dari: $NTSYNC_PATCH_URL"
            curl -fLSs "$NTSYNC_PATCH_URL" -o ntsync.patch
            patch -p1 --no-backup-if-mismatch < ntsync.patch
          fi

          if [ -f drivers/misc/ntsync.c ] && [ -f include/uapi/linux/ntsync.h ]; then
            echo "ntsync.c ada di source"
            # Pastikan Kconfig & Makefile punya entry NTSYNC
            if ! grep -q "config NTSYNC" drivers/misc/Kconfig; then
              python3 - <<'PY'
          p = "drivers/misc/Kconfig"
          s = open(p).read()
          ent = ("config NTSYNC\n"
                 "\ttristate \"NT synchronization primitive emulation\"\n"
                 "\thelp\n"
                 "\t  Driver /dev/ntsync untuk emulasi primitif sinkronisasi NT (Wine).\n\n")
          i = s.rfind("endmenu")
          assert i != -1, "endmenu tidak ketemu di drivers/misc/Kconfig"
          open(p, "w").write(s[:i] + ent + s[i:])
          PY
            fi
            grep -q "ntsync" drivers/misc/Makefile || echo 'obj-$(CONFIG_NTSYNC)	+= ntsync.o' >> drivers/misc/Makefile
            grep -n -i ntsync drivers/misc/Kconfig drivers/misc/Makefile
            echo "NTSYNC_READY=1" >> "$GITHUB_ENV"
          else
            echo "::warning::drivers/misc/ntsync.c tidak ada & tidak ada patch. NTSYNC dilewati. Isi ntsync_patch_url dengan backport 5.10."
            echo "NTSYNC_READY=0" >> "$GITHUB_ENV"
          fi

      - name: Info versi kernel
        run: |
          make kernelversion
          git log -3 --oneline || true
          echo "--- BORE ---"
          grep -rn "SCHED_BORE" init/Kconfig kernel/sched/Kconfig 2>/dev/null | head -3 || true
          echo "--- BBR ---"
          grep -n -i "bbrv3\|BBR v3" net/ipv4/tcp_bbr.c | head -3 || true

      - name: Build kernel
        run: |
          export PATH="$HOME/neutron/bin:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          export KBUILD_BUILD_USER="kaell"
          export KBUILD_BUILD_HOST="github-actions"

          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CC=clang"

          make $MAKE_ARGS ${{ inputs.defconfig }}

          # LTO
          case "${{ inputs.lto_mode }}" in
            keep)
              echo "LTO: ikut defconfig"
              ;;
            thin)
              scripts/config --file out/.config -d LTO_NONE -d LTO_CLANG_FULL -e LTO_CLANG_THIN
              ;;
            full)
              scripts/config --file out/.config -d LTO_NONE -d LTO_CLANG_THIN -e LTO_CLANG_FULL
              ;;
            none)
              scripts/config --file out/.config -e LTO_NONE -d LTO_CLANG_THIN -d LTO_CLANG_FULL
              ;;
          esac

          # Governor Kaelltzyy
          scripts/config --file out/.config -e CPU_FREQ_GOV_KAELLTZYY
          if [ "${{ inputs.kaelltzyy_default }}" = "true" ]; then
            scripts/config --file out/.config -d CPU_FREQ_DEFAULT_GOV_SCHEDUTIL -e CPU_FREQ_DEFAULT_GOV_KAELLTZYY
          fi

          # ZRAM default lz4
          scripts/config --file out/.config -e ZRAM -e CRYPTO_LZ4 -e LZ4_COMPRESS -e LZ4_DECOMPRESS \
            -d ZRAM_DEF_COMP_LZO -d ZRAM_DEF_COMP_ZSTD -e ZRAM_DEF_COMP_LZ4 --set-str ZRAM_DEF_COMP "lz4"
          scripts/config --file out/.config -e COMPACTION

          # Timer frequency 1000 Hz
          scripts/config --file out/.config -d HZ_100 -d HZ_250 -d HZ_300 -e HZ_1000 --set-val HZ 1000

          # Matikan debug (kurangi overhead)
          scripts/config --file out/.config -d SCHED_DEBUG -d SCHEDSTATS -d DEBUG_PREEMPT \
            -d LOCKDEP -d DEBUG_LOCK_ALLOC -d SLUB_DEBUG -d SLUB_DEBUG_ON -d PM_DEBUG

          # Uclamp (boost task game dari user-space)
          scripts/config --file out/.config -e UCLAMP_TASK -e UCLAMP_TASK_GROUP

          # Optimasi -O3 (kalau symbol ada di source; KCFLAGS di bawah jadi fallback)
          if grep -q "CC_OPTIMIZE_FOR_PERFORMANCE_O3" init/Kconfig; then
            scripts/config --file out/.config -d CC_OPTIMIZE_FOR_PERFORMANCE -e CC_OPTIMIZE_FOR_PERFORMANCE_O3
          fi

          # NTSYNC (built-in supaya tidak perlu modul)
          if [ "${NTSYNC_READY:-0}" = "1" ]; then
            scripts/config --file out/.config -e NTSYNC
          fi

          # KernelSU-Next (hook pakai kprobe)
          if [ "${{ inputs.ksu_enable }}" = "true" ]; then
            scripts/config --file out/.config -e KSU -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS
          fi

          # Nama kernel
          scripts/config --file out/.config --set-str LOCALVERSION "-${KERNEL_LOCALVERSION}"
          scripts/config --file out/.config -d LOCALVERSION_AUTO

          make $MAKE_ARGS olddefconfig
          make $MAKE_ARGS KCFLAGS="-O3" -j"$(nproc --all)" Image 2>&1 | tee build.log

          test -f out/arch/arm64/boot/Image || { echo "Build gagal: Image tidak ada"; exit 1; }

      - name: Cek hasil build
        run: |
          ls -lh out/arch/arm64/boot/Image
          strings out/arch/arm64/boot/Image | grep -m1 "Linux version" || true
          grep -E '^CONFIG_(HZ|SCHED_DEBUG|SCHEDSTATS|UCLAMP|CC_OPTIMIZE|LOCALVERSION|LTO_CLANG|CFI_CLANG|MODVERSIONS|KSU|KPROBES|NTSYNC|ZRAM|CPU_FREQ_DEFAULT_GOV)' out/.config || true
          cp out/.config kaelltzyy.config

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 "$ANYKERNEL_REPO" ak3
          rm -rf ak3/.git ak3/README.md
          cp out/arch/arm64/boot/Image ak3/Image
          DATE=$(date +%Y%m%d-%H%M)
          echo "ZIP_NAME=${KERNEL_NAME}-${DATE}" >> "$GITHUB_ENV"
          # anykernel.sh sama seperti workflow lama yang berhasil boot:
          # tanpa cek device, hanya ganti kernel (split_boot + flash_boot, ramdisk tidak dibongkar)
          cat > ak3/anykernel.sh <<'AKEOF'
          ### AnyKernel3 - KaelltzyyxPERF GKI 5.10 (tanpa cek device, kernel saja)
          properties() { '
          kernel.string=KaelltzyyxPERF
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          AKEOF
          cd ak3
          zip -r9 "../${KERNEL_NAME}-${DATE}.zip" . -x "*.git*"

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            kaelltzyy.config
